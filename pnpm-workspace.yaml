# pnpm settings live here as of pnpm 10.x — the "pnpm" field in package.json is
# no longer read (pnpm warns and ignores it), which would silently drop every
# security override below. See https://pnpm.io/settings

onlyBuiltDependencies:
  - fallow
  - puppeteer

# Security overrides for transitive dependencies whose direct parent has not yet
# shipped a release pulling the patched version. Ranges are scoped per major so
# a package is never force-upgraded across a major it was not tested against.
# Drop an entry once the parent resolves the patched version on its own.
overrides:
  # GHSA-4cwx-7wf7-3272 (high) + 4 medium — via jsdom (8.x) and cheerio (6.x)
  undici@<6.28.0: ^6.28.0
  undici@>=7.0.0 <7.29.0: ^7.29.0
  # Floor only. The lockfile pins the exact 8.x (8.10.0 while 8.10.1 clears the
  # publish-age gate); a floor lets the next 8.x security release land on
  # `pnpm update`, whereas an exact-version override would silently downgrade it.
  undici@>=8.0.0 <8.10.0: ^8.10.0
  # GHSA-rgw5-rvv9-x895 (high) — via minimatch/glob. 4.x has no patched release
  # (the advisory's fix for 4.x is 5.0.9, a cross-major jump we don't force);
  # nothing in the tree resolves 4.x today, so Dependabot will flag it if one appears.
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=3.0.0 <3.0.6: ^3.0.6
  # GHSA-jmr9-qjv8-65gv (high) — extract-zip has no patched release at all.
  # It is only reachable via pa11y-ci > pa11y > puppeteer 24 > @puppeteer/browsers 2.x.
  # pa11y 10 moves to puppeteer 25, whose @puppeteer/browsers 3.x replaced
  # extract-zip with modern-tar, so the package drops out of the tree entirely.
  # pa11y 10's only breaking changes are Node >= 22.13 and the puppeteer bump.
  pa11y@<10.0.0: ^10.0.0
  puppeteer@<25.0.0: ^25.9.0
  puppeteer-core@<25.0.0: ^25.9.0
  # GHSA-2v37-7h3g-55p8 (high) — via postcss/vite
  nanoid@<3.3.18: ^3.3.18
  nanoid@>=4.0.0 <5.1.6: ^5.1.6
  ws@>=8.0.0 <8.20.1: ^8.20.1
  lodash@<4.18.0: ^4.18.0
  vite@>=8.0.0 <=8.0.15: ^8.0.16
  postcss@>=8.0.0 <8.5.18: ^8.5.25
