name: Deploy to GitHub Pages

# Build the production bundle and publish it to GitHub Pages every time
# main moves. This includes the weekly crawl's auto-commits to data —
# when weekly-crawl.yml pushes a refreshed catalog, this workflow
# republishes the site so the new programs appear without a manual
# re-deploy.
#
# Note: the deploy workflow only builds and uploads. The crawl runs
# under .github/workflows/weekly-crawl.yml on its own schedule.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy. Don't cancel an in-flight run when a
# new commit lands; let it finish and then run the queued one. That way
# we never serve a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Official Vite+ CI action — installs vp, sets up Node, picks the
      # package manager from `packageManager` in package.json, and caches
      # the install. Matches the local dev pin (Node 24 LTS).
      # https://viteplus.dev/guide/ci
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "24"
          cache: true

      - name: Install deps
        # Skip optionalDependencies — `playwright` is only needed by the
        # crawler (weekly-crawl.yml). Saves ~70MB and a few seconds here.
        # setup-vp doesn't put pnpm on PATH, so go through `vp install`
        # and pass the skip via the env var pnpm reads (same knob the
        # README documents for Cloudflare Pages).
        run: vp install
        env:
          PNPM_CONFIG_OPTIONAL: "false"

      - name: Validate (format + lint + type-check + duplication)
        run: vp run check

      # The data-integrity tests are the last gate before a weekly-crawl
      # commit reaches production — deploy.yml is dispatched directly by
      # weekly-crawl.yml, so this must not rely on ci.yml having run.
      - name: Test (unit + data integrity)
        run: vp test

      - name: Build
        run: vp build
        env:
          # Asset paths must be prefixed with /<repo>/ when served from
          # GitHub Pages. vite.config.ts reads this env var and sets
          # `base` accordingly.
          VITE_GH_PAGES: "1"

      - name: Add 404.html for HashRouter deep links
        # GitHub Pages serves index.html only at the root. Without a
        # 404.html fallback, deep-linking to /uc-entrepreneurship-hub/#/program/...
        # would 404 on a fresh session before the SPA boots. Copying the
        # built index.html to 404.html lets Pages serve the SPA shell on
        # any path, and the HashRouter inside reads the fragment to land
        # on the right page.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
